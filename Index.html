<!DOCTYPE html>
<html>
<head>
    <title>SUNTIK SOSMED</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#1a0000;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            font-family:Arial
        }
        .salju{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            pointer-events:none
        }
        .salju i{
            position:absolute;
            top:-10px;
            width:6px;height:6px;
            background:#8b0000;
            border-radius:50%;
            box-shadow:0 0 20px red;
            animation:turun linear infinite
        }
        @keyframes turun{to{transform:translateY(100vh)}}
        .kotak{
            position:relative;
            z-index:2;
            width:90%;
            max-width:400px;
            background:#200;
            border:3px solid #f44;
            border-radius:30px;
            padding:20px;
            box-shadow:0 0 50px red
        }
        h1{color:#f99;text-align:center;margin-bottom:15px}
        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            background:#300;
            border:2px solid #f66;
            border-radius:12px;
            color:#fcc;
            font-size:16px
        }
        .tombol{
            width:100%;
            padding:15px;
            background:linear-gradient(45deg,#c00,#f33);
            border:none;
            border-radius:40px;
            color:white;
            font-size:18px;
            font-weight:bold;
            margin:10px 0;
            cursor:pointer
        }
        #pilihan{
            background:#400;
            border:2px solid #f66;
            border-radius:15px;
            padding:10px;
            margin:10px 0;
            display:none
        }
        .item{
            padding:12px;
            margin:5px 0;
            background:#600;
            border-radius:8px;
            color:#fbb;
            cursor:pointer;
            border:2px solid #900
        }
        .item.pilih{
            background:#a00;
            border-color:#fff;
            box-shadow:0 0 15px red
        }
        .popup{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.95);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:999
        }
        .popup div{
            background:#200;
            border:4px solid #f33;
            border-radius:40px;
            padding:30px;
            text-align:center;
            width:300px;
            color:#fcc
        }
        .popup h2{color:#f66;margin-bottom:15px}
        .popup button{
            background:#c00;
            border:none;
            padding:10px 30px;
            border-radius:30px;
            color:white;
            margin-top:15px;
            cursor:pointer
        }
    </style>
</head>
<body>
    <div class="salju" id="salju"></div>
    
    <div class="kotak">
        <h1>[ SUNTIK SOSMED ]</h1>
        <input type="text" id="user" placeholder="USERNAME">
        <input type="tel" id="phone" placeholder="NOMOR TLP">
        <button class="tombol" onclick="tampil()">[ PILIH SUNTIKAN ]</button>
        
        <div id="pilihan"></div>
        
        <button class="tombol" id="btnKirim" onclick="kirim()" style="display:none">[ KIRIM ]</button>
    </div>

    <div class="popup" id="popup">
        <div>
            <h2 id="judul">[ ERROR ]</h2>
            <p id="pesan">ISI DULU BOS!</p>
            <button onclick="tutup()">[ OK ]</button>
        </div>
    </div>

    <script>
        for(let i=50;i--;){
            let s=document.createElement('i')
            s.style.left=Math.random()*100+'%'
            s.style.animationDuration=Math.random()*3+2+'s'
            s.style.width=s.style.height=Math.random()*10+3+'px'
            s.style.background='rgba(139,0,0,'+(Math.random()*0.8+0.2)+')'
            document.getElementById('salju').appendChild(s)
        }

        let dataSuntik = [
            '50 like 20k','100 like 40k','233 like 47k','400 like 50k','1.333 like 87k',
            '50 comment 20k','120 comment 32k','566 comment 40k','1.000 comment 65k','paket lengkap 300k'
        ]
        
        let selected = -1

        function tampil(){
            let user = document.getElementById('user').value.trim()
            let phone = document.getElementById('phone').value.trim()
            
            if(!user || !phone){
                document.getElementById('judul').innerHTML='[ GAGAL ]'
                document.getElementById('pesan').innerHTML='ISI USERNAME & NO TLP!'
                document.getElementById('popup').style.display='flex'
                return
            }
            
            let html = ''
            for(let i=0;i<dataSuntik.length;i++){
                html += `<div class="item" onclick="pilih(${i})" id="item${i}">${dataSuntik[i]}</div>`
            }
            document.getElementById('pilihan').innerHTML = html
            document.getElementById('pilihan').style.display = 'block'
            document.getElementById('btnKirim').style.display = 'block'
        }

        function pilih(idx){
            for(let i=0;i<dataSuntik.length;i++){
                document.getElementById('item'+i)?.classList.remove('pilih')
            }
            document.getElementById('item'+idx).classList.add('pilih')
            selected = idx
        }

        function kirim(){
            let user = document.getElementById('user').value.trim()
            let phone = document.getElementById('phone').value.trim()
            
            if(selected==-1){
                document.getElementById('judul').innerHTML='[ ERROR ]'
                document.getElementById('pesan').innerHTML='PILIH SUNTIKAN!'
                document.getElementById('popup').style.display='flex'
                return
            }
            
            let pesan = `hai,saya mau suntik sosmed (tiktok)
username:${user}
suntik:${dataSuntik[selected]}
nomor telepon:${phone}
mohon balas secepatnya 🙏`
            
            window.location.href = `mailto:kilzz7488@gmail.com?subject=SUNTIK SOSMED&body=${encodeURIComponent(pesan)}`
            
            document.getElementById('judul').innerHTML='[ SUKSES ]'
            document.getElementById('pesan').innerHTML='CEK EMAIL BOS!'
            document.getElementById('popup').style.display='flex'
        }

        function tutup(){
            document.getElementById('popup').style.display='none'
        }
    </script>
</body>
  </html>
